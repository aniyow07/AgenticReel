<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentReel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/header.css">
<link rel="stylesheet" href="/static/css/layout.css">
<link rel="stylesheet" href="/static/css/buttons.css">
<link rel="stylesheet" href="/static/css/brief-box.css">
<link rel="stylesheet" href="/static/css/style-tiles.css">
<link rel="stylesheet" href="/static/css/fields.css">
<link rel="stylesheet" href="/static/css/recent.css">
<link rel="stylesheet" href="/static/css/rendering.css">
<link rel="stylesheet" href="/static/css/live-preview.css">
<link rel="stylesheet" href="/static/css/result.css">
<link rel="stylesheet" href="/static/css/library.css">
<link rel="stylesheet" href="/static/css/feedback.css">
<link rel="stylesheet" href="/static/css/responsive.css">
<script>
  try { var t = localStorage.getItem('agentreel-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <div class="top-left">
    <a href="/create" class="logo" data-link>AgentReel</a>
    <nav class="nav" aria-label="Main">
      <a href="/create" data-link data-nav="create">Create</a>
      <a href="/library" data-link data-nav="library">Library</a>
    </nav>
  </div>
  <div class="top-right">
    <a href="#" class="queue" id="queue" data-link hidden><span class="dot pulse" aria-hidden="true"></span><span id="queue-text"></span></a>
    <button type="button" class="icon-btn" id="theme" aria-label="Switch to light mode" title="Switch to light mode">
      <svg class="i-sun" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
    <span class="model" id="model"></span>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<dialog id="confirm" aria-labelledby="confirm-title">
  <form method="dialog" class="dlg">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text" class="hint"></p>
    <div class="dlg-actions">
      <button type="submit" value="cancel" class="btn">Cancel</button>
      <button type="submit" value="ok" class="btn danger" id="confirm-ok"></button>
    </div>
  </form>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button type="button" id="toast-btn" class="toast-btn"></button></div>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
